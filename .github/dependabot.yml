# Dependabot config for Starvia
# Free for public repos. Auto-creates PRs when deps need updates.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "auto-merge-candidate"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"
    # Auto-merge security patches only (low risk for Starvia)
    # Major version bumps still need Peat review
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    # B (2026-09-24): pin major for breaking build tools — vite 5→8,
    # vitest 2→5, jsdom 24→30 break CI in 17s. Allow patch+minor only.
    # Major bumps still need Peat review via manual PR.
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
